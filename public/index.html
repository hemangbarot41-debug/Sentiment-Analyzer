<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1em;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .button-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .results {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
            display: none;
        }
        
        .results.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .result-section {
            margin-bottom: 20px;
        }
        
        .result-section h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .sentiment-display {
            font-size: 2em;
            font-weight: bold;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin: 10px 0;
        }
        
        .sentiment-positive {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }
        
        .sentiment-negative {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }
        
        .sentiment-neutral {
            background: #e2e3e5;
            color: #383d41;
            border: 2px solid #6c757d;
        }
        
        .cleaned-text {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            color: #333;
            line-height: 1.6;
        }
        
        .scores {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        
        .score-item {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        
        .score-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .score-value {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .score-positive {
            color: #28a745;
        }
        
        .score-negative {
            color: #dc3545;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #f5c6cb;
            display: none;
            margin-bottom: 20px;
        }
        
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sentiment Analyzer</h1>
        <p class="subtitle">Analyze the emotional tone of your text</p>
        
        <div class="error" id="errorBox"></div>
        
        <form id="analysisForm">
            <div class="form-group">
                <label for="textInput">Enter your text:</label>
                <textarea 
                    id="textInput" 
                    placeholder="Type or paste your text here..." 
                    required
                ></textarea>
            </div>
            
            <button type="submit" id="analyzeBtn">
                <div class="button-content">
                    <span id="btnText">Analyze</span>
                    <div class="spinner" id="spinner"></div>
                </div>
            </button>
        </form>
        
        <div class="results" id="results">
            <div class="result-section">
                <h3>Sentiment:</h3>
                <div id="sentimentDisplay" class="sentiment-display"></div>
            </div>
            
            <div class="result-section">
                <h3>Processed Text:</h3>
                <div class="cleaned-text" id="cleanedText"></div>
            </div>
            
            <div class="result-section">
                <h3>Analysis Scores:</h3>
                <div class="scores">
                    <div class="score-item">
                        <div class="score-label">Positive Words</div>
                        <div class="score-value score-positive" id="positiveScore">0</div>
                    </div>
                    <div class="score-item">
                        <div class="score-label">Negative Words</div>
                        <div class="score-value score-negative" id="negativeScore">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('analysisForm');
        const textInput = document.getElementById('textInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btnText');
        const errorBox = document.getElementById('errorBox');
        const resultsDiv = document.getElementById('results');
        const sentimentDisplay = document.getElementById('sentimentDisplay');
        const cleanedText = document.getElementById('cleanedText');
        const positiveScore = document.getElementById('positiveScore');
        const negativeScore = document.getElementById('negativeScore');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const text = textInput.value.trim();
            
            if (!text) {
                showError('Please enter some text to analyze');
                return;
            }
            
            hideError();
            setLoading(true);
            
            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text })
                });
                
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }
                
                const data = await response.json();
                displayResults(data);
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to analyze text. Please try again.');
            } finally {
                setLoading(false);
            }
        });
        
        function setLoading(loading) {
            analyzeBtn.disabled = loading;
            spinner.style.display = loading ? 'block' : 'none';
            btnText.textContent = loading ? 'Analyzing...' : 'Analyze';
        }
        
        function displayResults(data) {
            sentimentDisplay.textContent = data.sentiment;
            sentimentDisplay.className = `sentiment-display sentiment-${data.sentiment.toLowerCase()}`;
            
            cleanedText.textContent = data.cleanedText || '(No content after removing stop words)';
            positiveScore.textContent = data.positiveScore || 0;
            negativeScore.textContent = data.negativeScore || 0;
            
            resultsDiv.classList.add('show');
            resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.add('show');
        }
        
        function hideError() {
            errorBox.classList.remove('show');
        }
    </script>
</body>
</html>
